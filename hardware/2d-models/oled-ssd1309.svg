<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="4" markerHeight="4" refX="3.4" refY="2" orient="auto-start-reverse">
      <path d="M0,0 L4,2 L0,4 z" fill="#444"/>
    </marker>
    <style>
      .edge   { fill:#fafafa; stroke:#111; stroke-width:0.4; }
      .glass  { fill:#dceaff; stroke:#1c4fa0; stroke-width:0.35; }
      .active { fill:#aeccff; stroke:#1c4fa0; stroke-width:0.2; }
      .feat   { fill:#eee; stroke:#555; stroke-width:0.25; }
      .hole   { fill:#fff; stroke:#111; stroke-width:0.3; }
      .dim    { stroke:#444; stroke-width:0.18; marker-start:url(#arr); marker-end:url(#arr); }
      .dimb   { stroke:#1c4fa0; stroke-width:0.18; marker-start:url(#arr); marker-end:url(#arr); }
      .dimg   { stroke:#0a7a2f; stroke-width:0.18; marker-start:url(#arr); marker-end:url(#arr); }
      .ext    { stroke:#888; stroke-width:0.12; }
      .t      { font-size:2.6px; fill:#111; }
      .td     { font-size:2.5px; fill:#222; text-anchor:middle; }
      .tb     { font-size:2.4px; fill:#1c4fa0; text-anchor:middle; }
      .tg     { font-size:2.4px; fill:#0a7a2f; text-anchor:middle; }
      .lbl    { font-size:3px; fill:#111; font-weight:bold; }
      .small  { font-size:2.1px; fill:#444; }
      .title  { font-size:5px; fill:#111; font-weight:bold; }
    </style>
  </defs>

  <rect x="4" y="4" width="289" height="202" fill="none" stroke="#111" stroke-width="0.4"/>
  <text x="10" y="14" class="title">PLAN — OLED 2.42" SSD1309 (128×64) — fully dimensioned</text>
  <text x="10" y="20" class="small">Orthographic views · units = mm · scale 1:1 on A4 · source: hicenda mechanical drawing</text>

  <!-- ===================== FRONT VIEW (face) ===================== -->
  <text x="64" y="28" class="lbl" text-anchor="middle">VUE DE FACE / FRONT</text>
  <!-- module outline 72 x 43 : x 28..100, y 38..81 -->
  <rect x="28" y="38" width="72" height="43" class="edge"/>
  <!-- viewing area (glass) 57.01 x 29.5 : x 35.48..92.49, y 43.11..72.61 -->
  <rect x="35.48" y="43.11" width="57.01" height="29.5" class="glass"/>
  <!-- active (pixel) area 55.01 x 27.49 : x 36.47..91.48, y 44.12..71.61 -->
  <rect x="36.47" y="44.12" width="55.01" height="27.49" class="active"/>
  <!-- 4 mounting holes Ø2.80, 2.10 from each edge -->
  <circle cx="30.1" cy="40.1" r="1.4" class="hole"/>
  <circle cx="97.9" cy="40.1" r="1.4" class="hole"/>
  <circle cx="30.1" cy="78.9" r="1.4" class="hole"/>
  <circle cx="97.9" cy="78.9" r="1.4" class="hole"/>
  <!-- 7-pin header along bottom edge, 2.50 pitch -->
  <g class="feat">
    <rect x="56.5" y="74.6" width="1.4" height="1.4"/>
    <rect x="59.0" y="74.6" width="1.4" height="1.4"/>
    <rect x="61.5" y="74.6" width="1.4" height="1.4"/>
    <rect x="64.0" y="74.6" width="1.4" height="1.4"/>
    <rect x="66.5" y="74.6" width="1.4" height="1.4"/>
    <rect x="69.0" y="74.6" width="1.4" height="1.4"/>
    <rect x="71.5" y="74.6" width="1.4" height="1.4"/>
  </g>
  <text x="64" y="79.2" class="small" text-anchor="middle">7-pin @2.50: GND VCC SCL SDA RES DC CS</text>

  <!-- overall width 72.00 (top) -->
  <line class="ext" x1="28" y1="38" x2="28" y2="29.5"/>
  <line class="ext" x1="100" y1="38" x2="100" y2="29.5"/>
  <line class="dim" x1="28" y1="31" x2="100" y2="31"/>
  <text x="64" y="30.3" class="td">72.00 ±0.5</text>
  <!-- hole pitch X 67.80 (top, inner) -->
  <line class="ext" x1="30.1" y1="40.1" x2="30.1" y2="34"/>
  <line class="ext" x1="97.9" y1="40.1" x2="97.9" y2="34"/>
  <line class="dim" x1="30.1" y1="35.2" x2="97.9" y2="35.2"/>
  <text x="64" y="34.6" class="td">hole pitch 67.80</text>
  <!-- overall height 43.00 (far left) -->
  <line class="ext" x1="28" y1="38" x2="18" y2="38"/>
  <line class="ext" x1="28" y1="81" x2="18" y2="81"/>
  <line class="dim" x1="19.5" y1="38" x2="19.5" y2="81"/>
  <text x="16.5" y="59.5" class="td" transform="rotate(-90 16.5 59.5)">43.00 ±0.5</text>
  <!-- hole pitch Y 38.80 (left, inner) -->
  <line class="ext" x1="30.1" y1="40.1" x2="24" y2="40.1"/>
  <line class="ext" x1="30.1" y1="78.9" x2="24" y2="78.9"/>
  <line class="dim" x1="25.2" y1="40.1" x2="25.2" y2="78.9"/>
  <text x="22.7" y="59.5" class="td" transform="rotate(-90 22.7 59.5)">38.80</text>
  <!-- hole inset 2.10 + Ø callout -->
  <text x="30.1" y="86" class="td">4× Ø2.80 · inset 2.10 from edges</text>
  <!-- V.A width 57.01 (bottom) -->
  <line class="ext" x1="35.48" y1="72.61" x2="35.48" y2="90"/>
  <line class="ext" x1="92.49" y1="72.61" x2="92.49" y2="90"/>
  <line class="dimb" x1="35.48" y1="88.5" x2="92.49" y2="88.5"/>
  <text x="64" y="87.8" class="tb">V.A 57.01</text>
  <!-- V.A height 29.5 (right) -->
  <line class="ext" x1="92.49" y1="43.11" x2="106" y2="43.11"/>
  <line class="ext" x1="92.49" y1="72.61" x2="106" y2="72.61"/>
  <line class="dimb" x1="104.5" y1="43.11" x2="104.5" y2="72.61"/>
  <text x="107.5" y="57.86" class="tb" transform="rotate(-90 107.5 57.86)">V.A 29.5</text>
  <!-- A.A label -->
  <text x="64" y="92.5" class="tb">A.A (pixels) 55.01 × 27.49</text>
  <!-- offset left 7.48 -->
  <line class="dimg" x1="28" y1="41" x2="35.48" y2="41"/>
  <text x="31.7" y="40.3" class="tg">7.48</text>
  <!-- offset top ~5.11 -->
  <line class="ext" x1="92.49" y1="38" x2="113" y2="38"/>
  <line class="dimg" x1="111.5" y1="38" x2="111.5" y2="43.11"/>
  <text x="113.5" y="41" class="tg" text-anchor="start">≈5.11</text>

  <!-- ===================== TOP VIEW (dessus) ===================== -->
  <text x="64" y="104" class="lbl" text-anchor="middle">VUE DE DESSUS / TOP</text>
  <!-- 72 wide x 5.90 thick : x 28..100, y 108..113.9 -->
  <rect x="28" y="108" width="72" height="5.9" class="edge"/>
  <!-- glass/display stack on front face: step 2.90 -->
  <rect x="28" y="108" width="72" height="1.2" class="glass"/>
  <text x="103" y="109.5" class="small">glass/display face</text>
  <!-- thickness 5.90 (right) -->
  <line class="ext" x1="100" y1="108" x2="113" y2="108"/>
  <line class="ext" x1="100" y1="113.9" x2="113" y2="113.9"/>
  <line class="dim" x1="111.5" y1="108" x2="111.5" y2="113.9"/>
  <text x="114.5" y="111" class="td" transform="rotate(-90 114.5 111)">5.90 max</text>
  <text x="64" y="119" class="small" text-anchor="middle">drawing steps: PCB ≈1.0 · front glass/display stack to 2.90 · overall 5.90 max</text>

  <!-- ===================== SIDE VIEW (côté) ===================== -->
  <text x="150" y="28" class="lbl" text-anchor="middle">VUE DE CÔTÉ / SIDE</text>
  <!-- 5.90 thick x 43 high : x 147..152.9, y 38..81 -->
  <rect x="147" y="38" width="5.9" height="43" class="edge"/>
  <rect x="147" y="38" width="1.2" height="43" class="glass"/>
  <text x="137" y="36" class="small">glass face →</text>
  <!-- thickness 5.90 (bottom) -->
  <line class="ext" x1="147" y1="81" x2="147" y2="88"/>
  <line class="ext" x1="152.9" y1="81" x2="152.9" y2="88"/>
  <line class="dim" x1="147" y1="86.5" x2="152.9" y2="86.5"/>
  <text x="149.95" y="85.8" class="td">5.90</text>
  <!-- height 43 (right) -->
  <line class="ext" x1="152.9" y1="38" x2="160" y2="38"/>
  <line class="ext" x1="152.9" y1="81" x2="160" y2="81"/>
  <line class="dim" x1="158.5" y1="38" x2="158.5" y2="81"/>
  <text x="161.5" y="59.5" class="td" transform="rotate(-90 161.5 59.5)">43.00</text>

  <!-- ===================== LEGEND ===================== -->
  <g transform="translate(180,28)">
    <text x="0" y="0" class="lbl">LÉGENDE / LEGEND</text>
    <rect x="0" y="3" width="8" height="4" class="edge"/>
    <text x="10" y="6.2" class="t">module outline (datasheet)</text>
    <rect x="0" y="9" width="8" height="4" class="glass"/>
    <text x="10" y="12.2" class="t">V.A — viewing glass (window cutout)</text>
    <rect x="0" y="15" width="8" height="4" class="active"/>
    <text x="10" y="18.2" class="t">A.A — active pixel area</text>
    <circle cx="4" cy="23" r="1.4" class="hole"/>
    <text x="10" y="24.2" class="t">Ø2.80 mounting hole (4×)</text>
  </g>

  <!-- ===================== TITLE BLOCK ===================== -->
  <g transform="translate(200,150)">
    <rect x="0" y="0" width="89" height="52" fill="none" stroke="#111" stroke-width="0.4"/>
    <line x1="0" y1="10" x2="89" y2="10" stroke="#111" stroke-width="0.3"/>
    <text x="3" y="7" class="lbl">VW HUD — Main Assembly</text>
    <text x="3" y="16" class="t">Component: OLED 2.42" SSD1309 (diymore)</text>
    <text x="3" y="21" class="t">Outline 72.00 × 43.00 × 5.90 max · 4× Ø2.80</text>
    <text x="3" y="26" class="t">Hole pitch 67.80 × 38.80 (inset 2.10)</text>
    <text x="3" y="31" class="t">V.A 57.01 × 29.5 (window) · A.A 55.01 × 27.49</text>
    <text x="3" y="36" class="t">3.3 V · ICC ≤120 mA @100% · −40…+85 °C</text>
    <text x="3" y="42" class="small">Source: hicenda mechanical drawing (clone of diymore)</text>
    <text x="3" y="46" class="small">File: hardware/2d-models/oled-ssd1309.svg</text>
    <text x="3" y="50" class="small">Units mm · Scale 1:1 (A4) · 1st-angle layout</text>
  </g>
</svg>
