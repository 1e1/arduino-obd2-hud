<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="ui-sans-serif,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <!-- Named zones of the IDLE screen (mode arrêt). The thin rule splits vehicle identity (above) from this trip (below).
       Category letters: V = VIN, O = Odometer, T = Trip, A = Averages, F = Fuel bar.
       LAYOUT IS FIXED across boards — on light boards (e.g. 328) the VIN row just stays blank (no reflow).
       T1/T2 are shown WITHOUT units (identical in idle & drive → read at a glance); A1/A2 keep their units. -->
  <defs>
    <style>
      .lbl{fill:#dfe7ef;font-size:14px}
      .grp{fill:#dfe7ef;font-size:15px;font-weight:700}
      .title{fill:#dfe7ef;font-size:20px;font-weight:700}
      .cap{fill:#8c98a6;font-size:12px}
      .oled{fill:#8fe9ff}
      .badgetxt{fill:#06090d;font-size:12px;font-weight:700}
      .lead{stroke:#5a6675;stroke-width:1.2;fill:none}
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="640" fill="#0c0f13"/>
  <text x="40" y="44" class="title">Idle mode — zones</text>
  <text x="40" y="66" class="cap">OLED 128×64. Rule splits identity (V VIN, O odometer) from trip (T, A). F = fuel bar. Same font (profont12_tr).</text>
  <text x="40" y="84" class="cap">Layout fixed across boards; VIN row blank on light boards (no reflow). T1/T2 unitless; A1/A2 with units.</text>

  <!-- ============================ SCREEN MOCK (scale 6, origin 70,150) ============================ -->
  <rect x="56" y="136" width="796" height="412" rx="10" fill="#06090d" stroke="#2a323d"/>
  <rect x="70" y="150" width="768" height="384" fill="#04070a"/>

  <!-- ABOVE THE RULE — vehicle identity -->
  <text x="454" y="192" class="oled" font-size="22" font-weight="700" text-anchor="middle" font-family="ui-monospace,monospace">WVWZZZ7NZJV000123</text>
  <text x="454" y="252" class="oled" font-size="22" text-anchor="middle" font-family="ui-monospace,monospace">142537 km</text>
  <rect x="70" y="268" width="768" height="4" class="oled"/>

  <!-- BELOW THE RULE -->
  <!-- A1 avg speed (left, km/h) · A2 avg consumption (right, l/100) — averages, middle row -->
  <text x="78"  y="372" class="oled" font-size="22" font-family="ui-monospace,monospace">42 km/h</text>
  <text x="828" y="372" class="oled" font-size="22" text-anchor="end" font-family="ui-monospace,monospace">1.7 l/100</text>
  <!-- T1 distance · T2 time — SAME line/style as DRIVE (trip line y51, no units, smaller font) -->
  <text x="78"  y="456" class="oled" font-size="18" font-family="ui-monospace,monospace">198</text>
  <text x="828" y="456" class="oled" font-size="18" text-anchor="end" font-family="ui-monospace,monospace">1:13</text>

  <!-- F: fuel bar -->
  <rect x="76" y="480" width="756" height="48" fill="none" stroke="#8fe9ff" stroke-width="3"/>
  <rect x="80" y="484" width="514" height="40" class="oled" opacity="0.85"/>
  <rect x="594" y="480" width="6" height="48" class="oled"/>
  <rect x="668" y="480" width="6" height="48" class="oled"/>
  <text x="92" y="516" fill="#04070a" font-size="20" font-weight="700" font-family="ui-monospace,monospace">55</text>
  <rect x="604" y="500" width="44" height="26" fill="#8fe9ff"/>
  <text x="612" y="520" fill="#04070a" font-size="20" font-weight="700" font-family="ui-monospace,monospace">10</text>

  <!-- ============================ MARKERS ============================ -->
  <!-- V (white) -->
  <circle cx="44" cy="192" r="14" fill="#e8eef5"/><text x="44" y="197" text-anchor="middle" class="badgetxt">V1</text>
  <line x1="58" y1="192" x2="280" y2="192" class="lead"/>
  <!-- O (orange) -->
  <circle cx="620" cy="252" r="14" fill="#ff9f43"/><text x="620" y="257" text-anchor="middle" class="badgetxt">O1</text>
  <line x1="606" y1="252" x2="540" y2="252" class="lead"/>
  <!-- A (pink) — averages, middle row -->
  <circle cx="44" cy="372" r="14" fill="#ff6b9d"/><text x="44" y="377" text-anchor="middle" class="badgetxt">A1</text>
  <line x1="58" y1="372" x2="76" y2="368" class="lead"/>
  <circle cx="884" cy="372" r="14" fill="#ff6b9d"/><text x="884" y="377" text-anchor="middle" class="badgetxt">A2</text>
  <line x1="870" y1="372" x2="828" y2="368" class="lead"/>
  <!-- T (purple) — bottom trip line (same position/style as DRIVE) -->
  <circle cx="44" cy="456" r="14" fill="#a55eea"/><text x="44" y="461" text-anchor="middle" class="badgetxt">T1</text>
  <line x1="58" y1="456" x2="76" y2="452" class="lead"/>
  <circle cx="884" cy="456" r="14" fill="#a55eea"/><text x="884" y="461" text-anchor="middle" class="badgetxt">T2</text>
  <line x1="870" y1="456" x2="828" y2="452" class="lead"/>
  <!-- F (green) -->
  <circle cx="140" cy="585" r="14" fill="#2ed573"/><text x="140" y="590" text-anchor="middle" class="badgetxt">F3</text>
  <line x1="140" y1="571" x2="100" y2="520" class="lead"/>
  <circle cx="540" cy="565" r="14" fill="#2ed573"/><text x="540" y="570" text-anchor="middle" class="badgetxt">F1</text>
  <line x1="546" y1="551" x2="597" y2="528" class="lead"/>
  <circle cx="710" cy="565" r="14" fill="#2ed573"/><text x="710" y="570" text-anchor="middle" class="badgetxt">F2</text>
  <line x1="704" y1="551" x2="671" y2="528" class="lead"/>
  <circle cx="640" cy="600" r="14" fill="#2ed573"/><text x="640" y="605" text-anchor="middle" class="badgetxt">F4</text>
  <line x1="640" y1="586" x2="626" y2="528" class="lead"/>

  <!-- ============================ TREE (right) ============================ -->
  <g transform="translate(884,150)">
    <text x="0" y="0" class="title" font-size="17">Zoning</text>

    <rect x="0" y="20" width="10" height="10" fill="#e8eef5"/><text x="20" y="30" class="grp">V — VIN (above rule)</text>
    <circle cx="14" cy="52" r="11" fill="#e8eef5"/><text x="14" y="56" text-anchor="middle" class="badgetxt">V1</text><text x="34" y="56" class="lbl">VIN, positive + thin rule under (board-gated)</text>

    <rect x="0" y="74" width="10" height="10" fill="#ff9f43"/><text x="20" y="84" class="grp">O — Odometer (above rule)</text>
    <circle cx="14" cy="106" r="11" fill="#ff9f43"/><text x="14" y="110" text-anchor="middle" class="badgetxt">O1</text><text x="34" y="110" class="lbl">total odometer (km)</text>

    <rect x="0" y="128" width="10" height="10" fill="#ff6b9d"/><text x="20" y="138" class="grp">A — Averages (middle row, with units)</text>
    <circle cx="14" cy="160" r="11" fill="#ff6b9d"/><text x="14" y="164" text-anchor="middle" class="badgetxt">A1</text><text x="34" y="164" class="lbl">average speed (km/h) — left</text>
    <circle cx="14" cy="186" r="11" fill="#ff6b9d"/><text x="14" y="190" text-anchor="middle" class="badgetxt">A2</text><text x="34" y="190" class="lbl">average consumption (l/100) — right</text>

    <rect x="0" y="212" width="10" height="10" fill="#a55eea"/><text x="20" y="222" class="grp">T — Trip (bottom line — same as DRIVE)</text>
    <circle cx="14" cy="244" r="11" fill="#a55eea"/><text x="14" y="248" text-anchor="middle" class="badgetxt">T1</text><text x="34" y="248" class="lbl">distance (km) — left, no unit</text>
    <circle cx="14" cy="270" r="11" fill="#a55eea"/><text x="14" y="274" text-anchor="middle" class="badgetxt">T2</text><text x="34" y="274" class="lbl">elapsed time h:mm — right, no unit</text>

    <rect x="0" y="296" width="10" height="10" fill="#2ed573"/><text x="20" y="306" class="grp">F — Fuel bar</text>
    <circle cx="14" cy="328" r="11" fill="#2ed573"/><text x="14" y="332" text-anchor="middle" class="badgetxt">F1</text><text x="34" y="332" class="lbl">fuel cursor (current level)</text>
    <circle cx="14" cy="350" r="11" fill="#2ed573"/><text x="14" y="354" text-anchor="middle" class="badgetxt">F2</text><text x="34" y="354" class="lbl">start separator (level at trip start)</text>
    <circle cx="14" cy="372" r="11" fill="#2ed573"/><text x="14" y="376" text-anchor="middle" class="badgetxt">F3</text><text x="34" y="376" class="lbl">fuel left, litres (carved)</text>
    <circle cx="14" cy="394" r="11" fill="#2ed573"/><text x="14" y="398" text-anchor="middle" class="badgetxt">F4</text><text x="34" y="398" class="lbl">fuel burnt, litres (XOR)</text>
  </g>
</svg>
